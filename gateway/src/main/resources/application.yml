server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      # Simple test route: echo service so you can verify the gateway works now
      routes:
        - id: httpbin
          uri: https://httpbin.org/#/Images/get_image
          predicates:
            - Path=/test/**
          filters:
            - StripPrefix=1

        - id: catalog
          uri: lb://catalog-service
          predicates: [ Path=/api/catalog/** ]
          filters: [ StripPrefix=1 ]

        - id: inventory
          uri: lb://inventory-service
          predicates: [ Path=/api/inventory/** ]
          filters: [ StripPrefix=1 ]

        - id: order
          uri: lb://order-service
          predicates: [ Path=/api/order/** ]
          filters: [ StripPrefix=1 ]

        - id: payment
          uri: lb://payment-service
          predicates: [ Path=/api/payment/** ]
          filters: [ StripPrefix=1 ]


      default-filters:
        - RemoveRequestHeader=Cookie
    discovery:
      locator:
        enabled: true  # (later) to route automatically by serviceId

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
